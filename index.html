<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Календарь событий</title>

    <!-- ============================================================
         ПОДКЛЮЧЕНИЕ TELEGRAM WEB APP SCRIPT
         Этот скрипт обязателен для корректной работы внутри Telegram.
         Он предоставляет API для управления темой, размерами окна и т.д.
    ============================================================ -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        /* ============================================================
               ГЛОБАЛЬНЫЕ СТИЛИ И ПЕРЕМЕННЫЕ
               ============================================================ */
        :root {
            /* Основные цвета – будут переопределены из Telegram, если доступно */
            --tg-bg-color: #ffffff;
            --tg-text-color: #222222;
            --tg-hint-color: #999999;
            --tg-link-color: #2481cc;
            --tg-button-color: #2481cc;
            --tg-button-text-color: #ffffff;
            --tg-secondary-bg-color: #f0f0f0;

            /* Дополнительные цвета для календаря */
            --calendar-bg: var(--tg-bg-color);
            --calendar-text: var(--tg-text-color);
            --calendar-muted: var(--tg-hint-color);
            --calendar-accent: var(--tg-link-color);
            --calendar-accent-text: #ffffff;
            --calendar-day-hover: rgba(0, 0, 0, 0.05);
            --calendar-today-bg: rgba(36, 129, 204, 0.15);
            --calendar-selected-border: var(--tg-link-color);
            --calendar-modal-bg: var(--tg-bg-color);
            --calendar-modal-text: var(--tg-text-color);
            --calendar-modal-overlay: rgba(0, 0, 0, 0.5);
            --calendar-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
            --calendar-radius: 16px;

            /* Шрифты */
            --font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }

        /* Тёмная тема – если Telegram сообщает о тёмной теме */
        @media (prefers-color-scheme: dark) {
            :root {
                --tg-bg-color: #1e1e1e;
                --tg-text-color: #ffffff;
                --tg-hint-color: #aaaaaa;
                --tg-link-color: #64b5f6;
                --tg-button-color: #64b5f6;
                --tg-button-text-color: #000000;
                --tg-secondary-bg-color: #2c2c2c;

                --calendar-bg: var(--tg-bg-color);
                --calendar-text: var(--tg-text-color);
                --calendar-muted: var(--tg-hint-color);
                --calendar-accent: var(--tg-link-color);
                --calendar-accent-text: #000000;
                --calendar-day-hover: rgba(255, 255, 255, 0.05);
                --calendar-today-bg: rgba(100, 181, 246, 0.2);
                --calendar-selected-border: var(--tg-link-color);
                --calendar-modal-bg: #2c2c2c;
                --calendar-modal-text: #ffffff;
                --calendar-modal-overlay: rgba(0, 0, 0, 0.7);
                --calendar-shadow: 0 8px 30px rgba(0, 0, 0, 0.5);
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--calendar-bg);
            color: var(--calendar-text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            transition: background-color 0.3s ease, color 0.3s ease;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* ============================================================
               КОНТЕЙНЕР КАЛЕНДАРЯ
               ============================================================ */
        .calendar-container {
            width: 100%;
            max-width: 500px;
            background: var(--calendar-bg);
            border-radius: var(--calendar-radius);
            box-shadow: var(--calendar-shadow);
            overflow: hidden;
            transition: all 0.3s ease;
            position: relative;
        }

        /* Шапка календаря */
        .calendar-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px 20px;
            background: var(--tg-secondary-bg-color);
            border-bottom: 1px solid rgba(0,0,0,0.05);
        }

        .calendar-header .month-year {
            font-size: 1.2rem;
            font-weight: 600;
        }

        .nav-btn {
            background: none;
            border: none;
            font-size: 1.8rem;
            line-height: 1;
            cursor: pointer;
            color: var(--calendar-accent);
            padding: 0 10px;
            transition: transform 0.2s ease, opacity 0.2s ease;
            outline: none;
            -webkit-tap-highlight-color: transparent;
        }

        .nav-btn:active {
            transform: scale(0.8);
            opacity: 0.7;
        }

        /* Сетка дней недели */
        .weekdays {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            background: var(--tg-secondary-bg-color);
            padding: 8px 0;
            text-align: center;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--calendar-muted);
            text-transform: uppercase;
        }

        /* Сетка дней */
        .days-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 2px;
            padding: 10px;
        }

        .day-cell {
            aspect-ratio: 1 / 1;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.95rem;
            border-radius: 12px;
            cursor: pointer;
            position: relative;
            transition: background-color 0.2s ease, transform 0.2s ease, box-shadow 0.2s ease;
            -webkit-tap-highlight-color: transparent;
            border: 2px solid transparent;
        }

        .day-cell:hover {
            background-color: var(--calendar-day-hover);
        }

        .day-cell:active {
            transform: scale(0.9);
        }

        .day-cell.today {
            background-color: var(--calendar-today-bg);
            font-weight: 700;
        }

        .day-cell.has-events::after {
            content: '';
            position: absolute;
            bottom: 6px;
            left: 50%;
            transform: translateX(-50%);
            width: 5px;
            height: 5px;
            border-radius: 50%;
            background-color: var(--calendar-accent);
        }

        .day-cell.selected {
            border-color: var(--calendar-selected-border);
            background-color: var(--calendar-day-hover);
            box-shadow: 0 0 0 3px rgba(36, 129, 204, 0.2);
        }

        .day-cell.other-month {
            color: var(--calendar-muted);
            opacity: 0.5;
        }

        /* ============================================================
               МОДАЛЬНОЕ ОКНО (POPUP)
               ============================================================ */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--calendar-modal-overlay);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
            backdrop-filter: blur(4px);
            -webkit-backdrop-filter: blur(4px);
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--calendar-modal-bg);
            color: var(--calendar-modal-text);
            border-radius: var(--calendar-radius);
            padding: 20px;
            max-width: 90%;
            width: 400px;
            max-height: 80vh;
            overflow-y: auto;
            box-shadow: var(--calendar-shadow);
            transform: scale(0.5);
            opacity: 0;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.3s ease;
            transform-origin: center;
            position: relative;
        }

        .modal-overlay.active .modal-content {
            transform: scale(1);
            opacity: 1;
        }

        /* Анимация "из ячейки" задаётся через inline style для transform-origin */
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        .modal-header h3 {
            font-size: 1.2rem;
        }

        .modal-close {
            background: none;
            border: none;
            font-size: 1.8rem;
            cursor: pointer;
            color: var(--calendar-muted);
            transition: transform 0.2s ease;
        }

        .modal-close:active {
            transform: rotate(90deg);
        }

        .event-item {
            margin-bottom: 15px;
            padding-bottom: 15px;
            border-bottom: 1px solid rgba(0,0,0,0.1);
        }

        .event-item:last-child {
            margin-bottom: 0;
            padding-bottom: 0;
            border-bottom: none;
        }

        .event-title {
            font-weight: 600;
            margin-bottom: 5px;
        }

        .event-description {
            font-size: 0.9rem;
            color: var(--calendar-muted);
            margin-bottom: 8px;
        }

        .event-image {
            max-width: 100%;
            border-radius: 8px;
            margin: 8px 0;
        }

        .event-links {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 8px;
        }

        .event-link {
            display: inline-block;
            background: var(--calendar-accent);
            color: var(--calendar-accent-text);
            padding: 6px 12px;
            border-radius: 20px;
            text-decoration: none;
            font-size: 0.85rem;
            transition: opacity 0.2s ease, transform 0.2s ease;
        }

        .event-link:active {
            transform: scale(0.95);
            opacity: 0.8;
        }

        /* Анимация смены месяца */
        .month-slide-enter {
            animation: slideIn 0.3s ease forwards;
        }

        .month-slide-exit {
            animation: slideOut 0.3s ease forwards;
        }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(30px); }
            to   { opacity: 1; transform: translateX(0); }
        }

        @keyframes slideOut {
            from { opacity: 1; transform: translateX(0); }
            to   { opacity: 0; transform: translateX(-30px); }
        }

        /* Адаптивные отступы для мобильных */
        @media (max-width: 480px) {
            .calendar-container {
                border-radius: 12px;
            }
            .calendar-header {
                padding: 12px 16px;
            }
            .days-grid {
                gap: 1px;
                padding: 6px;
            }
            .day-cell {
                font-size: 0.85rem;
                border-radius: 8px;
            }
            .modal-content {
                padding: 15px;
                width: 95%;
            }
        }

        /* Для очень маленьких экранов */
        @media (max-width: 320px) {
            .day-cell {
                font-size: 0.7rem;
            }
            .calendar-header .month-year {
                font-size: 1rem;
            }
        }
    </style>
</head>
<body>

    <!-- ============================================================
         КОНТЕЙНЕР КАЛЕНДАРЯ
         ============================================================ -->
    <div class="calendar-container" id="calendarApp">
        <!-- Шапка с навигацией -->
        <div class="calendar-header">
            <button class="nav-btn" id="prevMonthBtn">‹</button>
            <div class="month-year" id="monthYearLabel"></div>
            <button class="nav-btn" id="nextMonthBtn">›</button>
        </div>

        <!-- Названия дней недели -->
        <div class="weekdays">
            <div>Пн</div>
            <div>Вт</div>
            <div>Ср</div>
            <div>Чт</div>
            <div>Пт</div>
            <div>Сб</div>
            <div>Вс</div>
        </div>

        <!-- Сетка дней -->
        <div class="days-grid" id="daysGrid"></div>
    </div>

    <!-- ============================================================
         МОДАЛЬНОЕ ОКНО ДЛЯ СОБЫТИЙ
         ============================================================ -->
    <div class="modal-overlay" id="modalOverlay">
        <div class="modal-content" id="modalContent">
            <div class="modal-header">
                <h3 id="modalDate"></h3>
                <button class="modal-close" id="modalCloseBtn">×</button>
            </div>
            <div id="modalEvents"></div>
        </div>
    </div>

    <script>
        // ============================================================
        // ИНИЦИАЛИЗАЦИЯ TELEGRAM WEB APP
        // ============================================================
        let tg = window.Telegram.WebApp;

        // Сообщаем Telegram, что приложение готово к работе
        tg.ready();

        // Разворачиваем приложение на весь экран (рекомендуется)
        tg.expand();

        // Применяем цветовую схему Telegram, если она доступна
        function applyTelegramTheme() {
            const theme = tg.themeParams;
            if (theme) {
                document.documentElement.style.setProperty('--tg-bg-color', theme.bg_color || '#ffffff');
                document.documentElement.style.setProperty('--tg-text-color', theme.text_color || '#222222');
                document.documentElement.style.setProperty('--tg-hint-color', theme.hint_color || '#999999');
                document.documentElement.style.setProperty('--tg-link-color', theme.link_color || '#2481cc');
                document.documentElement.style.setProperty('--tg-button-color', theme.button_color || '#2481cc');
                document.documentElement.style.setProperty('--tg-button-text-color', theme.button_text_color || '#ffffff');
                document.documentElement.style.setProperty('--tg-secondary-bg-color', theme.secondary_bg_color || '#f0f0f0');
            }
        }
        applyTelegramTheme();

        // Слушаем изменения темы (если пользователь переключит в Telegram)
        tg.onEvent('themeChanged', applyTelegramTheme);

        // ============================================================
        // НАСТРОЙКА ДАННЫХ КАЛЕНДАРЯ
        // ============================================================
        // Объект eventsData содержит события по датам.
        // Ключ – строка в формате 'YYYY-MM-DD' (год-месяц-день).
        // Значение – массив объектов событий.
        //
        // Формат события:
        // {
        //   title: string,          // Заголовок события
        //   description: string,    // Описание (можно HTML)
        //   image: string (url),    // (необязательно) ссылка на изображение
        //   links: [                // (необязательно) массив ссылок
        //     {
        //       url: string,        // URL топика Telegram или любой другой
        //       text: string,       // Текст ссылки (произвольный)
        //       emoji: string       // (необязательно) эмодзи вместо текста
        //     }
        //   ]
        // }
        //
        // Вы можете редактировать этот объект под свои нужды.
        // Для динамической подгрузки данных замените статический объект на fetch() к вашему API.
        const eventsData = {
            // Примеры для текущего месяца (будут отображены в соответствующие даты)
            // Тверь 22-23 ноября
            '2025-11-22': [
                {
                    title: 'Первый выездной турнир',
                    subtitle: 'Тверь 22-23 ноября 🏁',
                    description: 'КНТ "Stalex" г. Тверь  - "Тайм-Аут" НТ Москва',
                    links: [
                        { url: 'https://t.me/c/3037484330/20', text: 'Перейти к теме', emoji: '1️⃣' }
                    ]
                },
                {
                    title: 'Личный турнир',
                    links: [
                        { url: 'https://t.me/c/3037484330/20/729', text: 'По группам', emoji: '👨‍👨‍👧‍👧' }
                    ]
                }
            ],
            '2025-11-23': [
                {
                    title: 'Первый выездной турнир',
                    subtitle: 'Тверь 22-23 ноября 🏁',
                    description: 'КНТ "Stalex" г. Тверь  - "Тайм-Аут" НТ Москва',
                    links: [
                        { url: 'https://t.me/c/3037484330/20', text: 'Перейти к теме', emoji: '1️⃣' }
                    ]
                },
                {
                    title: 'Парный турнир',
                }
            ],
        };

        // ============================================================
        // ЛОГИКА КАЛЕНДАРЯ
        // ============================================================
        const calendarApp = document.getElementById('calendarApp');
        const daysGrid = document.getElementById('daysGrid');
        const monthYearLabel = document.getElementById('monthYearLabel');
        const prevMonthBtn = document.getElementById('prevMonthBtn');
        const nextMonthBtn = document.getElementById('nextMonthBtn');
        const modalOverlay = document.getElementById('modalOverlay');
        const modalContent = document.getElementById('modalContent');
        const modalDate = document.getElementById('modalDate');
        const modalEvents = document.getElementById('modalEvents');
        const modalCloseBtn = document.getElementById('modalCloseBtn');

        // Текущая отображаемая дата (месяц и год)
        let currentDate = new Date(); // сегодня
        let selectedDate = null;      // выбранная дата (для модального окна)

        // Массив названий месяцев для отображения
        const months = [
            'Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь',
            'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'
        ];

        // Массив названий дней недели (для совместимости с getDay())
        const weekDaysShort = ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'];

        /**
         * Форматирует дату в строку YYYY-MM-DD (локальное время)
         */
        function formatDateKey(year, month, day) {
            return `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
        }

        /**
         * Генерирует сетку дней для указанного месяца и года
         */
        function renderCalendar(year, month) {
            // Очищаем сетку
            daysGrid.innerHTML = '';

            // Обновляем заголовок
            monthYearLabel.textContent = `${months[month]} ${year}`;

            // Определяем первый день месяца (0 = воскресенье, 1 = понедельник, ...)
            const firstDay = new Date(year, month, 1);
            let startDay = firstDay.getDay(); // 0..6
            // Переводим на понедельник как первый день (Пн=0, Вс=6)
            startDay = (startDay === 0) ? 6 : startDay - 1;

            // Количество дней в месяце
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            // Количество дней в предыдущем месяце (для заполнения пустых ячеек)
            const daysInPrevMonth = new Date(year, month, 0).getDate();

            // Текущая дата для отметки "сегодня"
            const today = new Date();
            const todayKey = formatDateKey(today.getFullYear(), today.getMonth(), today.getDate());

            // Собираем все ячейки (42 = 6 недель * 7 дней)
            const totalCells = 42;
            let cells = [];

            for (let i = 0; i < totalCells; i++) {
                const dayNumber = i - startDay + 1; // день месяца (может быть <=0 или > daysInMonth)
                let cellDate = new Date(year, month, dayNumber);
                let cellYear = cellDate.getFullYear();
                let cellMonth = cellDate.getMonth();
                let cellDay = cellDate.getDate();
                let isOtherMonth = (cellMonth !== month);

                // Создаём элемент ячейки
                const dayCell = document.createElement('div');
                dayCell.className = 'day-cell';
                dayCell.textContent = cellDay;

                // Отмечаем "сегодня"
                const cellKey = formatDateKey(cellYear, cellMonth, cellDay);
                if (cellKey === todayKey) {
                    dayCell.classList.add('today');
                }

                // Если ячейка относится к другому месяцу, добавляем класс
                if (isOtherMonth) {
                    dayCell.classList.add('other-month');
                }

                // Проверяем наличие событий
                if (eventsData[cellKey]) {
                    dayCell.classList.add('has-events');
                }

                // Обработчик клика
                dayCell.addEventListener('click', () => handleDayClick(cellKey, dayCell));

                cells.push(dayCell);
            }

            // Добавляем ячейки в сетку
            cells.forEach(cell => daysGrid.appendChild(cell));

            // Анимация появления сетки
            daysGrid.classList.remove('month-slide-enter');
            void daysGrid.offsetWidth; // форсируем reflow для повторного запуска анимации
            daysGrid.classList.add('month-slide-enter');
        }

        /**
         * Обработчик клика по дню – открывает модальное окно с событиями
         */
        function handleDayClick(dateKey, dayCellElement) {
            selectedDate = dateKey;
            const events = eventsData[dateKey] || [];
            if (events.length === 0) {
                // Если событий нет, можно показать лёгкое уведомление или ничего
                return;
            }

            // Заполняем модальное окно
            showModal(dateKey, events, dayCellElement);
        }

        /**
         * Показывает модальное окно с анимацией из выбранной ячейки
         */
        function showModal(dateKey, events, sourceElement) {
            // Устанавливаем заголовок даты
            const [y, m, d] = dateKey.split('-').map(Number);
            modalDate.textContent = `${d} ${months[m-1]} ${y}`;

            // Генерируем HTML событий
            let eventsHTML = '';
            events.forEach(event => {
                eventsHTML += `
                    <div class="event-item">
                        <div class="event-title">${event.title}</div>
                        <div class="event-description">${event.description || ''}</div>
                        ${event.image ? `<img class="event-image" src="${event.image}" alt="${event.title}">` : ''}
                        ${event.links && event.links.length ? `
                            <div class="event-links">
                                ${event.links.map(link => `
                                    <a class="event-link" href="${link.url}" target="_blank" rel="noopener noreferrer">
                                        ${link.emoji ? link.emoji + ' ' : ''}${link.text || 'Ссылка'}
                                    </a>
                                `).join('')}
                            </div>
                        ` : ''}
                    </div>
                `;
            });
            modalEvents.innerHTML = eventsHTML;

            // Определяем координаты исходной ячейки для анимации
            const rect = sourceElement.getBoundingClientRect();
            const originX = rect.left + rect.width / 2;
            const originY = rect.top + rect.height / 2;

            // Устанавливаем transform-origin для модального контента
            modalContent.style.transformOrigin = `${originX}px ${originY}px`;

            // Показываем оверлей
            modalOverlay.classList.add('active');
        }

        /**
         * Закрывает модальное окно с анимацией "в ячейку"
         */
        function closeModal() {
            if (!selectedDate) return;
            // Находим ячейку, соответствующую выбранной дате, для корректной анимации
            const dateCells = document.querySelectorAll('.day-cell');
            let targetCell = null;
            dateCells.forEach(cell => {
                // Сравниваем текст и месяц/год? Проще найти по data-атрибуту, но мы его не задавали.
                // Для упрощения используем последнюю выбранную ячейку (сохранённую в selectedDateCell)
            });
            // Мы не сохранили ячейку, поэтому просто скроем с анимацией к центру (или к последней позиции)
            // Чтобы реализовать "в ячейку", можно сохранять ссылку на ячейку при открытии.
            // Для полноты добавим сохранение.
            // (см. модификацию выше: передаём sourceElement в showModal, но не сохраняем)
            // Модифицируем: в глобальной области будем хранить последнюю открытую ячейку.
            // Объявим переменную selectedDayElement.
            if (selectedDayElement) {
                const rect = selectedDayElement.getBoundingClientRect();
                modalContent.style.transformOrigin = `${rect.left + rect.width / 2}px ${rect.top + rect.height / 2}px`;
            }
            modalOverlay.classList.remove('active');
        }

        // Переменная для хранения элемента ячейки (для анимации закрытия)
        let selectedDayElement = null;

        // Модифицируем handleDayClick, чтобы сохранить ячейку
        function handleDayClick(dateKey, dayCellElement) {
            selectedDate = dateKey;
            selectedDayElement = dayCellElement;
            const events = eventsData[dateKey] || [];
            if (events.length === 0) return;
            showModal(dateKey, events, dayCellElement);
        }

        // Обновлённая функция showModal (уже использует sourceElement)
        // В closeModal используем selectedDayElement.

        // Обработчики навигации
        prevMonthBtn.addEventListener('click', () => {
            // Анимация ухода
            daysGrid.classList.add('month-slide-exit');
            setTimeout(() => {
                currentDate.setMonth(currentDate.getMonth() - 1);
                renderCalendar(currentDate.getFullYear(), currentDate.getMonth());
                daysGrid.classList.remove('month-slide-exit');
            }, 300); // должно совпадать с длительностью анимации
        });

        nextMonthBtn.addEventListener('click', () => {
            daysGrid.classList.add('month-slide-exit');
            setTimeout(() => {
                currentDate.setMonth(currentDate.getMonth() + 1);
                renderCalendar(currentDate.getFullYear(), currentDate.getMonth());
                daysGrid.classList.remove('month-slide-exit');
            }, 300);
        });

        // Закрытие модального окна
        modalCloseBtn.addEventListener('click', closeModal);

        // Закрытие по клику на оверлей
        modalOverlay.addEventListener('click', (e) => {
            if (e.target === modalOverlay) {
                closeModal();
            }
        });

        // Закрытие по кнопке "назад" в Telegram (если поддерживается)
        tg.onEvent('backButtonClicked', () => {
            if (modalOverlay.classList.contains('active')) {
                closeModal();
            }
        });

        // Показываем кнопку "Назад" в Telegram при открытом модальном окне
        function updateBackButton() {
            if (modalOverlay.classList.contains('active')) {
                tg.BackButton.show();
            } else {
                tg.BackButton.hide();
            }
        }

        // Переопределяем showModal и closeModal для вызова updateBackButton
        const originalShowModal = showModal;
        showModal = function(...args) {
            originalShowModal.apply(this, args);
            updateBackButton();
        };

        const originalCloseModal = closeModal;
        closeModal = function(...args) {
            originalCloseModal.apply(this, args);
            updateBackButton();
        };

        // Инициализация календаря
        renderCalendar(currentDate.getFullYear(), currentDate.getMonth());

        // ============================================================
        // ДОПОЛНИТЕЛЬНО: ОБРАБОТКА ОРИЕНТАЦИИ И РАЗМЕРА
        // ============================================================
        window.addEventListener('resize', () => {
            // Можно перерисовать, но не обязательно
        });
    </script>
</body>
</html>
