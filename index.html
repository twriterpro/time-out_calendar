            tg.BackButton.show();
        }

        // ============================================================
        // ОБРАБОТЧИКИ БЛИЖАЙШИХ
        // ============================================================
        function findNearestEvent(predicate) {
            const today = new Date();
            today.setHours(0,0,0,0);
            const allEvents = [];
            for (const [dateKey, events] of Object.entries(eventsData)) {
                events.forEach(ev => allEvents.push({dateKey, event: ev}));
            }
            const future = allEvents.filter(item => parseDateKey(item.dateKey) >= today);
            for (const item of future) {
                if (predicate(item.event)) return item;
            }
            return null;
        }

        function goToEvent(item) {
            if (!item) { alert('Событие не найдено'); return; }
            const dateKey = item.dateKey;
            const events = eventsData[dateKey];
            const [y,m,d] = dateKey.split('-').map(Number);
            currentDate = new Date(y, m-1, 1);
            renderCalendar(currentDate.getFullYear(), currentDate.getMonth());
            const targetCell = document.querySelector(`.day-cell[data-date-key="${dateKey}"]`);
            if (targetCell) {
                if (selectedDayElement) selectedDayElement.classList.remove('selected');
                targetCell.classList.add('selected');
                selectedDayElement = targetCell;
                showDateModal(dateKey, events, targetCell);
            } else {
                showDateModal(dateKey, events, null);
            }
        }

        nearestSelect.addEventListener('change', () => {
            const val = nearestSelect.value;
            if (val === 'none') return;
            let predicate;
            switch(val) {
                case 'out_current_closest':
                    predicate = ev => ev.type === 'out' && ['current','closest'].includes(ev.status);
                    break;
                case 'in_no':
                    predicate = ev => ev.type === 'in' && ev.guest === 'no';
                    break;
                case 'in_yes':
                    predicate = ev => ev.type === 'in' && ev.guest === 'yes';
                    break;
            }
            const item = findNearestEvent(predicate);
            goToEvent(item);
            nearestSelect.value = 'none';
        });

        // ============================================================
        // СЕКЦИЯ: КАРТА (OpenLayers) с легендой, фильтрацией и чекбоксом "мои игры"
        // ============================================================
        // Функция проверки участия текущего пользователя в событии
        function isUserParticipant(ev) {
            const user = tg.initDataUnsafe?.user;
            if (!user) return false;
            const username = user.username ? user.username.toLowerCase() : null;
            const userId = user.id ? Number(user.id) : null;

            if (username) {
                if (ev.users.some(u => u.toLowerCase() === '@' + username)) return true;
            }
            if (userId && ev.userIds.includes(userId)) return true;
            return false;
        }

        window.openMapModal = function() {
            mapModalOverlay.classList.add('active');
            if (!mapInstance) {
                mapInstance = new ol.Map({
                    target: mapContainer,
                    layers: [new ol.layer.Tile({ source: new ol.source.OSM() })],
                    view: new ol.View({
                        center: ol.proj.fromLonLat([37.6173, 55.7558]),
                        zoom: 3
                    }),
                    controls: ol.control.defaults.defaults().extend([new ol.control.Zoom()])
                });

                const locationEventsMap = {};
                const mergedEvents = getMergedEvents();
                mergedEvents.forEach(merged => {
                    let locationKey, coords, locationName;
                    if (merged.club && clubData[merged.club]) {
                        locationKey = 'club:' + merged.club;
                        coords = [clubData[merged.club].lon, clubData[merged.club].lat];
                        locationName = clubData[merged.club].name;
                    } else {
                        locationKey = 'city:' + merged.city;
                        coords = [cityData[merged.city].lon, cityData[merged.city].lat];
                        locationName = cityData[merged.city].name;
                    }
                    if (!locationEventsMap[locationKey]) {
                        locationEventsMap[locationKey] = {
                            coords: coords,
                            name: locationName,
                            events: []
                        };
                    }
                    locationEventsMap[locationKey].events.push(merged);
                });

                markerEntries = [];
                selectedStatuses = new Set();
                showOnlyMyEvents = false;

                Object.values(locationEventsMap).forEach(loc => {
                    const statuses = new Set();
                    loc.events.forEach(ev => {
                        const eff = getEffectiveStatus(ev, ev.title);
                        statuses.add(eff);
                    });
                    // Определяем есть ли события пользователя в этой локации
                    const hasMyEvents = loc.events.some(ev => isUserParticipant(ev));

                    let color = '#e74c3c';
                    if (statuses.has('play')) color = '#2ecc71';
                    else if (statuses.has('current')) color = '#f1c40f';
                    else if (statuses.has('closest')) color = '#9b59b6';
                    else if (statuses.has('finish')) color = '#e74c3c';
                    else if (statuses.has('plan')) color = '#95a5a6';

                    const flagEl = document.createElement('div');
                    flagEl.className = 'custom-flag-marker';
                    if (statuses.has('plan') && !statuses.has('play') && !statuses.has('current') && !statuses.has('closest') && !statuses.has('finish')) {
                        flagEl.classList.add('plan-flag');
                    }
                    if (statuses.has('play')) {
                        flagEl.classList.add('blink-flag');
                        flagEl.innerHTML = `<div class="play-label">ИГРАЕМ СЕЙЧАС</div>`;
                    }
                    flagEl.innerHTML += `
                        <div class="flag-pole" style="background:${color};"></div>
                        <div class="flag-canvas" style="background:linear-gradient(135deg, ${color} 0%, ${color} 100%);"></div>
                        <div class="flag-count" style="background:${color};">${loc.events.length}</div>
                    `;

                    const marker = new ol.Overlay({
                        position: ol.proj.fromLonLat(loc.coords),
                        positioning: 'bottom-center',
                        element: flagEl,
                        stopEvent: false
                    });
                    mapInstance.addOverlay(marker);

                    const popupElement = document.createElement('div');
                    popupElement.className = 'ol-popup';
                    popupElement.innerHTML = `<strong>${loc.name}</strong><br>Мероприятий: ${loc.events.length}`;
                    loc.events.forEach(ev => {
                        const effStatus = getEffectiveStatus(ev, ev.title);
                        const st = getStatusConfig(effStatus);
                        const datesStr = ev.dates.length > 1
                            ? `${formatDateForDisplay(ev.dates[0])} - ${formatDateForDisplay(ev.dates[ev.dates.length-1])}`
                            : formatDateForDisplay(ev.dates[0]);
                        popupElement.innerHTML += `
                            <div style="margin-top:8px; padding-top:8px; border-top:1px solid #eee;">
                                <span style="background:${st.color}; display:inline-block; width:10px; height:10px; border-radius:50%;"></span>
                                <strong>${ev.title}</strong><br>
                                <small>${datesStr}</small><br>
                                ${ev.description ? `<small>${ev.description}</small><br>` : ''}
                                ${ev.links && ev.links.length ? ev.links.map(link => `<a href="${link.url}" target="_blank" rel="noopener noreferrer" style="color: #2481cc;">Перейти к теме</a>`).join('<br>') : ''}
                            </div>
                        `;
                    });

                    const popup = new ol.Overlay({
                        element: popupElement,
                        positioning: 'bottom-center',
                        offset: [0, -20]
                    });
                    mapInstance.addOverlay(popup);

                    flagEl.addEventListener('click', () => {
                        popup.setPosition(marker.getPosition());
                    });
                    mapInstance.on('click', () => {
                        popup.setPosition(undefined);
                    });

                    markerEntries.push({
                        overlay: marker,
                        element: flagEl,
                        statuses: statuses,
                        hasMyEvents: hasMyEvents
                    });
                });

                // Создаём легенду
                const legend = document.createElement('div');
                legend.className = 'map-legend';
                legend.innerHTML = `
                    <div class="map-legend-item" data-status="finish"><span class="legend-flag" style="background:linear-gradient(135deg, #e74c3c, #c0392b);"></span> играли</div>
                    <div class="map-legend-item" data-status="current"><span class="legend-flag" style="background:linear-gradient(135deg, #f1c40f, #d4ac0d);"></span> готовимся играть</div>
                    <div class="map-legend-item" data-status="play"><span class="legend-flag" style="background:linear-gradient(135deg, #2ecc71, #27ae60);"></span> играем сейчас</div>
                    <div class="map-legend-item" data-status="closest"><span class="legend-flag" style="background:linear-gradient(135deg, #9b59b6, #7d3c98);"></span> ближайшие</div>
                    <div class="map-legend-item" data-status="plan"><span class="legend-flag plan"></span> планируется</div>
                    <!-- Чекбокс "мои игры" внизу легенды -->
                    <label class="map-legend-checkbox">
                        <input type="checkbox" id="myGamesCheckbox">
                        <span>мои игры</span>
                    </label>
                `;
                mapContainer.appendChild(legend);

                const legendItems = legend.querySelectorAll('.map-legend-item');
                const myGamesCheckbox = legend.querySelector('#myGamesCheckbox');

                // Обработчики кликов по легенде
                legendItems.forEach(item => {
                    item.addEventListener('click', () => {
                        const status = item.dataset.status;
                        if (selectedStatuses.has(status)) {
                            selectedStatuses.delete(status);
                        } else {
                            selectedStatuses.add(status);
                        }
                        updateLegendUI();
                        applyLegendFilter();
                    });
                });

                // Обработчик чекбокса
                myGamesCheckbox.addEventListener('change', () => {
                    showOnlyMyEvents = myGamesCheckbox.checked;
                    applyLegendFilter();
                });

                function updateLegendUI() {
                    legendItems.forEach(item => {
                        const status = item.dataset.status;
                        if (selectedStatuses.size === 0) {
                            item.classList.remove('disabled');
                        } else {
                            if (selectedStatuses.has(status)) {
                                item.classList.remove('disabled');
                            } else {
                                item.classList.add('disabled');
                            }
                        }
                    });
                }

                function applyLegendFilter() {
                    markerEntries.forEach(entry => {
                        let shouldShow = true;

                        // Проверка по статусам
                        if (selectedStatuses.size > 0) {
                            shouldShow = [...entry.statuses].some(s => selectedStatuses.has(s));
                        }

                        // Проверка по "мои игры"
                        if (showOnlyMyEvents) {
                            shouldShow = shouldShow && entry.hasMyEvents;
                        }

                        if (shouldShow) {
                            entry.overlay.setElement(entry.element);
                        } else {
                            entry.overlay.setElement(null);
                        }
                    });
                }

                // Инициализация фильтра (все видимы)
                applyLegendFilter();

                // Анимация приближения
                setTimeout(() => {
                    mapInstance.getView().animate({
                        center: ol.proj.fromLonLat([37.6173, 55.7558]),
                        zoom: 5,
                        duration: 2000
                    });
                }, 500);
            }
            setTimeout(() => mapInstance.updateSize(), 100);
        };

        window.closeMapModal = function() {
            mapModalOverlay.classList.remove('active');
        };
        mapModalCloseBtn.addEventListener('click', closeMapModal);
        mapModalOverlay.addEventListener('click', (e) => { if (e.target === mapModalOverlay) closeMapModal(); });

        // ============================================================
        // ОБРАБОТЧИК КНОПКИ НАЗАД TELEGRAM
        // ============================================================
        tg.onEvent('backButtonClicked', () => {
            if (modalOverlay.classList.contains('active')) closeDateModal();
            else if (listModalOverlay.classList.contains('active')) closeListModal();
            else if (mapModalOverlay.classList.contains('active')) closeMapModal();
        });

        // ============================================================
        // ИНИЦИАЛИЗАЦИЯ
        // ============================================================
        populateSelects();
        renderCalendar(currentDate.getFullYear(), currentDate.getMonth());
    </script>
</body>
</html>
